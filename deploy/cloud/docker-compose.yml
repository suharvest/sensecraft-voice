# Control plane: backend + console + their stores.
# Shared by all three deployment modes — only the audio entry point differs.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sensecraft_voice}
    volumes: ["mysql-data:/var/lib/mysql"]
    ports: ["${MYSQL_PORT:-3306}:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set it in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set it in .env}
    volumes: ["minio-data:/data"]
    ports: ["9000:9000", "9001:9001"]

  service:
    build: { context: ../../cloud/service }
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["3008:3008"]
    volumes: ["../../cloud/service/config.yaml:/app/config.yaml:ro"]
    restart: unless-stopped

  console:
    build: { context: ../../cloud/console }
    depends_on: [service]
    ports: ["3000:80"]
    restart: unless-stopped

volumes: { mysql-data: {}, minio-data: {} }
